<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NextGen Apply</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color: #0f172a; }
    h1 { margin: 0 0 10px; font-size: 15px; color: #4f46e5; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 12px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button:disabled { opacity: 0.6; cursor: default; }
    .muted { color: #64748b; font-size: 12px; }
    .error { color: #b91c1c; font-size: 12px; margin-top: 8px; }
    .stats { display: flex; gap: 8px; margin: 8px 0; }
    .stat { flex: 1; padding: 8px; background: #f1f5f9; border-radius: 8px; text-align: center; }
    .stat b { display: block; font-size: 18px; }
    .next { margin-top: 6px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 400; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>NextGen Apply</h1>

  <section id="pair" hidden>
    <p class="muted">In the app, open <b>Apply Queue → Connect extension</b> and enter the code shown there.</p>
    <label for="code">Pairing code</label>
    <input id="code" type="text" placeholder="ABCD-EFGH" autocomplete="off">
    <label for="api">Backend API URL</label>
    <input id="api" type="text">
    <button id="pairBtn" type="button">Connect</button>
  </section>

  <section id="queue" hidden>
    <div class="stats">
      <div class="stat"><b id="remaining">–</b>to apply</div>
      <div class="stat"><b id="submitted">–</b>submitted</div>
    </div>
    <div id="next" class="next" hidden></div>
    <button id="startBtn" type="button">Start applying</button>
    <label class="check"><input id="autoNext" type="checkbox"> Open the next job after I submit</label>
    <button id="unpairBtn" class="secondary" type="button">Disconnect</button>
  </section>

  <p id="error" class="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>

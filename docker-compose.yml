services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/job-automation
      AUTOMATION_URL: http://automation:3001
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  automation:
    build:
      context: ./automation
      dockerfile: ../infrastructure/docker/Dockerfile.automation
    restart: unless-stopped
    env_file: .env
    environment:
      AUTOMATION_PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  backend-uploads:
